# Projet final - option A : une seule machine (Ubuntu 24.04 sous WSL2) qui porte Jenkins et Minikube
# provision.yml s'y applique en local ; deploy.yml parle à l'API Kubernetes (kubernetes.core) depuis localhost
[ci]
machine-ci ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[local]
localhost ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python }}"
